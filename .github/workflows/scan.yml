name: scan
on:
  schedule:
    - cron: "40 21 * * 1-5"   # ~16:40 ET зимой (после закрытия US); летом сдвиг на час — поправьте при переходе на DST
  workflow_dispatch:
concurrency:
  group: ssh-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ssh.run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: commit state
        run: |
          git config user.name "ssh-bot"; git config user.email "ssh-bot@users.noreply.github.com"
          git add data docs/signals.json docs/performance.json
          git diff --staged --quiet || (git commit -m "scan $(date -u +%F)" && git pull --rebase && git push)
