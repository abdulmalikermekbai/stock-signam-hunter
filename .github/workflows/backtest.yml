name: backtest
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 6"
permissions:
  contents: write
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m ssh.run backtest
      - run: |
          git config user.name "ssh-bot"; git config user.email "ssh-bot@users.noreply.github.com"
          git add docs/backtest.json
          git diff --staged --quiet || (git commit -m "backtest" && git pull --rebase && git push)
